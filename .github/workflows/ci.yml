name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Backs the PostgresIdempotencyStore integration tests.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAYMENTS_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/payments_test?user=payments&password=payments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle state and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build (compile, detekt, tests)
        run: ./gradlew build --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
